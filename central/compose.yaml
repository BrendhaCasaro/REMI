services:
  central:
    build:
      context: .
    container_name: remi-central
    depends_on:
      centraldb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://centraldb:5432/remi-centraldb
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: secret
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    ports:
      - "8080:8080"

  centraldb:
    image: postgres:16
    container_name: remi-centraldb
    environment:
      POSTGRES_DB: remi-centraldb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - centraldb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d remi-centraldb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  centraldb_data:
